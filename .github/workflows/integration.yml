name: Integration
on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.api'
      - '**.kt'
      - '**.kts'
      - .github/workflows/integration.yml
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
      - yarn.lock
  push:
    branches: [ main ]
    paths:
      - '**.api'
      - '**.kt'
      - '**.kts'
      - .github/workflows/integration.yml
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
      - yarn.lock
  workflow_dispatch:
env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 17
jobs:
  # --------------------------------- Stage 1 ----------------------------------
  gradle-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Build project
        run: ./gradlew :plugins:build
  qr-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Build project
        run: ./gradlew :types-qr-code:build
  types-internal:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Build project
        run: ./gradlew :types-internal:build
  # --------------------------------- Stage 2 ----------------------------------
  types:
    runs-on: macos-14
    needs:
      - gradle-plugins
      - types-internal
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Build project
        run: ./gradlew :types:build
  # --------------------------------- Stage 3 ----------------------------------
  types-design:
    runs-on: macos-14
    needs: types
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Build project
        run: ./gradlew :types-design:build
  types-kotlin-serialization:
    runs-on: macos-14
    needs: types
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Build project
        run: ./gradlew :types-kotlinx-serialization:build
