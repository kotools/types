name: Integration
on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.api'
      - '**.kt'
      - '**.kts'
      - .github/workflows/integration.yml
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
      - yarn.lock
  push:
    branches: [ main ]
    paths:
      - '**.api'
      - '**.kt'
      - '**.kts'
      - .github/workflows/integration.yml
      - gradle/**
      - gradle.properties
      - gradlew
      - gradlew.bat
      - yarn.lock
  workflow_dispatch:
env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: 17
jobs:
  check-kotlin-projects:
    name: Check Kotlin projects
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.1
      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-java-gradle
      - name: Check Gradle plugins
        run: ./gradlew :plugins:check
      - name: Check QR code project
        run: ./gradlew :types-qr-code:check
      - name: Check internals
        run: ./gradlew :types-internal:check
      - name: Check core library
        run: ./gradlew :types:check
      - name: Check integration with Kotlin Serialization
        run: ./gradlew :types-kotlinx-serialization:check
